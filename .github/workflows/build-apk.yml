name: Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not install obsolete package "tools" (removed from Google SDK repos).
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :android:app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :android:app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk MyDashboard-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: MyDashboard-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: MyDashboard APK v${{ github.run_number }}
          body: |
            Debug APK built automatically from `${{ github.sha }}`.

            Download: `MyDashboard-debug.apk`
          files: MyDashboard-debug.apk
          make_latest: true
